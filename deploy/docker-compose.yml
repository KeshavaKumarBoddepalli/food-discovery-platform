services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_discovery
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in deploy/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  backend:
    build:
      context: ../backend-springboot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/food_discovery?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in deploy/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      DB_POOL_SIZE: 5
      GOOGLE_OAUTH_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in deploy/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in deploy/.env}
      GOOGLE_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN in deploy/.env}/login/oauth2/code/google
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: Lax
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    networks:
      - app_network

  web:
    build:
      context: ../frontend-angularapp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
